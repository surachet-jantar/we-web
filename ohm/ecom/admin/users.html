<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Users — LCG SHOP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar" id="main-nav"></nav>

  <section class="section">
    <div class="container">
      <div class="admin-layout">
        <aside class="admin-sidebar">
          <div class="admin-sidebar-title"><i class="fas fa-cog"></i></div>
          <nav class="admin-sidebar-nav">
            <a href="index.html"><i class="fas fa-chart-pie"></i></a>
            <a href="products.html"><i class="fas fa-box"></i></a>
            <a href="orders.html"><i class="fas fa-receipt"></i></a>
            <a href="users.html" class="active"><i class="fas fa-users"></i></a>
          </nav>
        </aside>
        <div class="admin-main">
          <div class="admin-header">
            <h2 id="admin-page-title"></h2>
          </div>
          <div class="admin-table-wrapper" id="users-table-wrapper">
            <div class="loading"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="main-footer"></footer>

  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNav();
      renderFooter();
      if (!requireAdmin()) return;

      // Render sidebar with translations
      document.querySelector('.admin-sidebar-title').innerHTML = '<i class="fas fa-cog"></i> ' + t('admin_title');
      const navLinks = document.querySelectorAll('.admin-sidebar-nav a');
      const keys = ['admin_dashboard', 'admin_products', 'admin_orders', 'admin_users'];
      navLinks.forEach((a, i) => { a.innerHTML = a.querySelector('i').outerHTML + ' ' + t(keys[i]); });
      document.getElementById('admin-page-title').textContent = t('admin_users');

      loadUsers();
    });

    async function loadUsers() {
      try {
        const users = await api.getUsers();
        const wrapper = document.getElementById('users-table-wrapper');

        if (users.length === 0) {
          wrapper.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>' + t('no_results') + '</p></div>';
          return;
        }

        wrapper.innerHTML = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>${t('register_name')}</th>
                <th>${t('register_email')}</th>
                <th>${t('register_phone')}</th>
                <th>Role</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td style="font-size:.75rem;color:var(--text-muted);max-width:150px;overflow:hidden;text-overflow:ellipsis">${u.ID}</td>
                  <td><strong>${u.Name || ''}</strong></td>
                  <td>${u.Email || ''}</td>
                  <td>${u.Phone || ''}</td>
                  <td>
                    <span class="badge ${u.Role === 'admin' ? 'badge-admin' : 'badge-user'}">
                      ${(u.Role || 'user').toUpperCase()}
                    </span>
                  </td>
                  <td style="font-size:.8rem">${(u.CreatedAt || '').split('T')[0]}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } catch (e) {
        document.getElementById('users-table-wrapper').innerHTML = '<div class="empty-state"><p>' + t('error') + '</p></div>';
      }
    }
  </script>
</body>
</html>
